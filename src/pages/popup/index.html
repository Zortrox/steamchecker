<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Steam Library Checker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body class="">
    <header class="flex items-center gap-2 mb-3">
      <img src="/icons/icon-48.png" alt="" class="w-8 h-8 shrink-0" />
      <h1 class="font-bold text-lg leading-tight whitespace-nowrap">Steam Library Checker</h1>
    </header>

    <section id="signed-out" class="flex flex-col gap-3 mb-3" hidden>
      <p class="text-sm text-neutral-300 text-center">
        Sign in to foxslash with Steam or your foxslash account. SteamChecker
        uses the Steam account linked to it.
      </p>

      <button
        id="signInButton"
        type="button"
        class="bg-amber-400 text-base rounded px-3 py-2 text-black hover:bg-amber-500 transition-colors cursor-pointer font-semibold disabled:opacity-60 disabled:cursor-wait"
      >
        Log in
      </button>
    </section>

    <section id="signed-in" class="flex flex-col gap-3 mb-3" hidden>
      <div class="flex items-center gap-3">
        <img
          id="account-avatar"
          alt=""
          class="w-10 h-10 rounded bg-neutral-800 shrink-0"
          hidden
        />
        <div class="min-w-0">
          <div id="account-name" class="font-semibold truncate"></div>
          <div id="account-steam" class="text-sm text-neutral-400 truncate"></div>
        </div>
      </div>

      <div class="flex gap-2 justify-between items-center">
        <button
          id="refreshButton"
          type="button"
          class="bg-amber-400 text-sm rounded px-3 py-1 text-black hover:bg-amber-500 transition-colors cursor-pointer font-medium"
        >
          Refresh games
        </button>
        <button
          id="signOutButton"
          type="button"
          class="text-sm rounded px-3 py-1 border border-neutral-600 hover:border-neutral-400 transition-colors cursor-pointer"
        >
          Sign out
        </button>
      </div>
    </section>

    <p id="status-message" class="text-sm text-center my-3 empty:hidden text-neutral-300" role="status"></p>

    <footer class="flex flex-col gap-3 pt-3 border-t border-neutral-800 text-sm">
      <div class="flex justify-between gap-3">
        <a
          href="https://www.foxslash.com/apps/steamchecker/"
          target="_blank"
          class="flex items-center gap-1"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm0 11.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5ZM12 6a3.5 3.5 0 0 0-3.5 3.5h2a1.5 1.5 0 1 1 2.1 1.37c-.9.4-1.6 1.2-1.6 2.3V14h2v-.83c0-.3.2-.5.4-.6A3.5 3.5 0 0 0 12 6Z"
            />
          </svg>
          <span>How it works</span>
        </a>
        <a
          href="https://github.com/Zortrox/steamchecker"
          target="_blank"
          class="flex items-center gap-1"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <!--!Font Awesome Free 7.0.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->

            />
          </svg>

          <span>GitHub</span>
        </a>

      </div>

      <div class="flex justify-between text-xs text-neutral-500">
        <a href="https://store.steampowered.com" target="_blank" class="muted-link">Powered by Steam</a>
        <span id="version">v<span>...</span></span>
      </div>
    </footer>
  </body>

  <script type="module" src="popup.ts"></script>
</html>
