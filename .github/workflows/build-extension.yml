name: Predeploy Steps
on:
  push:
    branches:
      - main
      - beta
  pull_request:

jobs:
  version_and_build:
    runs-on: ubuntu-latest
    # semantic-release uses the workflow's own token: push the tag, create the
    # release, comment on released issues and PRs.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # semantic-release 26 needs Node >= 26.13
      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Lint for Firefox (AMO)
        run: bun run lint:firefox

      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium

      - name: Browser tests (built extension in Chromium)
        run: bun run test:e2e

      # Bumps package.json, rebuilds the zips with that version (prepareCmd in
      # .releaserc), tags, and attaches the zips to a GitHub release.
      - name: Automated Versioning and Release
        id: release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release

      - name: Save files to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamchecker-extension
          path: |
            extension-chrome.zip
            extension-firefox.zip
            extension-source.zip

  # Stable releases from main go to the stores; beta prereleases don't, since
  # their 4-part manifest version would block the next stable one.
  publish:
    needs: version_and_build
    if: needs.version_and_build.outputs.version != '' && needs.version_and_build.outputs.channel == 'latest'
    uses: ./.github/workflows/publish-stores.yml
    with:
      tag: v${{ needs.version_and_build.outputs.version }}
    secrets: inherit
