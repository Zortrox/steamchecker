name: Predeploy Steps
on:
  push:
    branches:
      - main
      - beta
  pull_request:

jobs:
  version_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # semantic-release 26 needs Node >= 26.13
      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Lint for Firefox (AMO)
        run: bun run lint:firefox

      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium

      - name: Browser tests (built extension in Chromium)
        run: bun run test:e2e

      - name: Automated Versioning and Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bunx semantic-release

      - name: Save files to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamchecker-extension
          path: |
            extension-chrome.zip
            extension-firefox.zip
